server:
  port: 9090
  servlet:
    context-path: /api/ragent

spring:
  application:
    name: ragent${unique-name:}-service

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB

  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: postgres
    password: postgres
    url: jdbc:postgresql://127.0.0.1:5432/postgres?client_encoding=UTF8
    hikari:
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000
      maximum-pool-size: 4
      minimum-idle: 1
      pool-name: RagentHikariPool

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: ragent-producer${unique-name:}_pg
    send-message-timeout: 2000
  topic:
    knowledge-document-chunk: knowledge-document-chunk_topic${unique-name:}
    message-feedback: message-feedback_topic${unique-name:}

milvus:
  uri: http://localhost:19530

rag:
  guidance:
    enabled: true
    ambiguity-score-ratio: 0.8
    ambiguity-margin: 0.15
    max-options: 3
  vector:
    type: pg
  default:
    collection-name: rag_default_store
    dimension: 1536
    metric-type: COSINE
    sse-timeout-ms: 300000
  query-rewrite:
    enabled: true
    max-history-messages: 4
    max-history-chars: 200
  rate-limit:
    global:
      enabled: true
      max-concurrent: 1
      max-wait-seconds: 3
      lease-seconds: 30
      poll-interval-ms: 200
  memory:
    history-keep-turns: 4
    summary-start-turns: 5
    summary-enabled: true
    ttl-minutes: 1440
    summary-max-chars: 200
    title-max-length: 30
  trace:
    enabled: true
    max-error-length: 1000
  search:
    default-top-k: 5
    channels:
      vector-global:
        enabled: true
        confidence-threshold: 0.6
        single-intent-supplement-threshold: 0.8
        top-k-multiplier: 3
      intent-directed:
        enabled: true
        min-intent-score: 0.4
        top-k-multiplier: 2
  mcp:
    servers:
      - name: default
        url: http://localhost:9099
  semaphore:
    document-upload:
      name: rag:document:upload
      max-concurrent: 1
      max-wait-seconds: 2
      lease-seconds: 900
    chat-import-qq:
      name: rag:chat-import:qq
      max-concurrent: 1
      max-wait-seconds: 2
      lease-seconds: 900
    chat-import-wechat:
      name: rag:chat-import:wechat
      max-concurrent: 1
      max-wait-seconds: 2
      lease-seconds: 900
  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60
      running-timeout-minutes: 120
    processing:
      embedding-batch-size: 4
      chat-embedding-batch-size: 2
      vector-write-batch-size: 5
      chat-transcript-cache-max-entries: 1
      chat-transcript-cache-ttl-seconds: 300

  upload:
    max-document-upload-size-mb: 20
    max-remote-download-size-mb: 20
    max-pipeline-upload-size-mb: 10
    max-chat-import-size-mb: 10
    max-parse-text-chars: 2000000
    min-temp-free-space-mb: 256

ai:
  providers:
    ollama:
      url: http://localhost:11434
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: ${BAILIAN_API_KEY:}
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
    siliconflow:
      url: https://api.siliconflow.cn
      api-key: ${SILICONFLOW_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings

  selection:
    failure-threshold: 2
    open-duration-ms: 30000
    allow-local-fallback: ${AI_ALLOW_LOCAL_FALLBACK:false}

  stream:
    message-chunk-size: 1

  chat:
    default-model: qwen3-max
    deep-thinking-model: qwen3-max
    candidates:
      - id: qwen-plus
        provider: bailian
        model: qwen-plus-latest
        priority: 1
      - id: qwen3-max
        provider: bailian
        model: qwen3-max
        supports-thinking: true
        priority: 3
      - id: glm-4.7
        provider: siliconflow
        model: Pro/zai-org/GLM-4.7
        supports-thinking: true
        priority: 1
      - id: qwen3-local
        provider: ollama
        model: qwen3:8b-fp16
        priority: 2
        enabled: ${AI_OLLAMA_CHAT_ENABLED:false}

  embedding:
    default-model: qwen-emb-8b
    max-concurrent: 1
    retry:
      max-attempts: 3
      backoff-ms: [2000, 5000, 10000]
    candidates:
      - id: qwen-emb-8b
        provider: siliconflow
        model: Qwen/Qwen3-Embedding-8B
        dimension: ${rag.default.dimension}
        priority: 1
      - id: qwen-emb-local
        provider: ollama
        model: qwen3-embedding:8b-fp16
        dimension: ${rag.default.dimension}
        priority: 2
        enabled: ${AI_OLLAMA_EMBEDDING_ENABLED:false}

  rerank:
    default-model: qwen3-rerank
    candidates:
      - id: qwen3-rerank
        provider: bailian
        model: qwen3-rerank
        priority: 1
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

rustfs:
  url: http://localhost:9000
  access-key-id: rustfsadmin
  secret-access-key: rustfsadmin

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

app:
  demo-mode: false
